[package]
name = "fast_renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
xerune = { path = "../", default-features = false }
fontdue = "0.9.3"
tiny-skia = { version = "0.12.0", optional = true }
log = "0.4"
coarse-prof = { version = "0.2.6", optional = true }

[features]
default = ["std"]
std = ["xerune/std", "dep:tiny-skia"]
profile = ["dep:coarse-prof"]
