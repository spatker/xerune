[package]
name = "xerune_render"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Software rasterizer for Xerune draw commands: rects, borders, shadows, gradients, images and text"
license = "MIT"
repository = "https://github.com/spatker/xerune"
keywords = ["rasterizer", "embedded", "software-rendering", "xerune"]
categories = ["embedded", "rendering", "graphics"]
readme = "README.md"
include = ["/src", "/README.md", "/LICENSE"]

[dependencies]
xerune = { version = "0.1.0", path = "../", default-features = false }
fontdue = "0.9.3"
ttf-parser = "0.20"
harfrust = "0.15"
png = "0.17"
log = "0.4"
hashbrown = { version = "0.14", default-features = false, features = ["ahash", "inline-more"] }
