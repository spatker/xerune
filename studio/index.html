<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xerune Browser Studio</title>
    
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Nunjucks Templating Library (Jinja2/Askama Compatible) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nunjucks/3.2.4/nunjucks.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #1ed760;
            --accent-glow: rgba(30, 215, 96, 0.4);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 215, 96, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            background: linear-gradient(135deg, #1ed760 0%, #1db954 100%);
            color: #000;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-container {
            display: flex;
            flex-grow: 1;
            padding: 30px 40px;
            gap: 30px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        /* The glassmorphic host container for our Xerune application */
        .app-host {
            flex: 3;
            min-width: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .app-host::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #1ed760, #6366f1);
        }

        /* Sidebar console for debugging and live state inspector */
        .sidebar {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 350px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-badge {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(30, 215, 96, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(30, 215, 96, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(30, 215, 96, 0); }
        }

        pre {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            overflow-y: auto;
            max-height: 280px;
            color: #a7f3d0;
        }

        .log-container {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            height: 180px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-item {
            display: flex;
            gap: 10px;
        }

        .log-time {
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .log-message {
            color: #60a5fa;
            word-break: break-all;
        }

        /* styling inside our hosted application */
        #app {
            background-color: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 800px;
            min-height: 560px;
            position: relative;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-group">
            <span class="logo-badge">WASM</span>
            <h1>Xerune Browser Studio</h1>
            <select id="example-select" style="margin-left: 20px; padding: 6px 12px; background: #161c2d; border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-family: inherit; font-size: 14px; cursor: pointer; outline: none; font-weight: 600;">
                <option value="todo">Todo List</option>
                <option value="calculator">Calculator</option>
                <option value="music_player">Music Player</option>
                <option value="animation">Animation Benchmark</option>
                <option value="animation_css">CSS Animation Showcase</option>
                <option value="showcase">Showcase Monitor</option>
                <option value="breakout">Breakout Game</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <!-- Rendered App -->
        <div class="app-host">
            <div id="app">
                <!-- App DOM will be dynamically injected here -->
            </div>
        </div>

        <!-- Sidebar Diagnostics -->
        <div class="sidebar">
            <!-- State Inspector -->
            <div class="panel">
                <div class="panel-title">
                    <span>Rust Model State</span>
                    <span class="live-badge"></span>
                </div>
                <pre id="state-json">Loading...</pre>
            </div>

            <!-- Event Logger -->
            <div class="panel">
                <div class="panel-title">
                    <span>Interaction Event Log</span>
                </div>
                <div id="logs" class="log-container">
                    <div style="color: var(--text-muted)">Waiting for events...</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        Xerune Project Studio &bull; Embedded Design in the Browser
    </footer>

    <!-- JS glue logic -->
    <script type="module">
        import init, { 
            TodoApp, 
            CalculatorApp, 
            MusicPlayerApp, 
            AnimationApp, 
            AnimationCssApp, 
            ShowcaseApp, 
            BreakoutApp 
        } from "./pkg/wasm_demo.js?v=8";
        import { initXeruneApp } from "../xerune.js?v=9";

        window.addEventListener("click", (e) => {
            console.log("Global window click target:", e.target);
            console.log("Global window click path:", e.composedPath());
        }, true);
        window.addEventListener("mousedown", (e) => {
            console.log("Global window mousedown target:", e.target);
        }, true);

        let currentAppCleanup = null;

        async function loadApp(appName) {
            // 1. Cleanup previous application
            if (currentAppCleanup) {
                currentAppCleanup();
                currentAppCleanup = null;
            }

            // 2. Reset side logs panel
            const logs = document.getElementById("logs");
            logs.innerHTML = `<div style="color: var(--text-muted)">Waiting for events...</div>`;

            let app;
            let templatePath;

            // 3. Instantiate chosen app and load template path
            if (appName === "todo") {
                app = new TodoApp("");
                templatePath = "../examples/todo/templates/todo_list.html";
            } else if (appName === "calculator") {
                app = new CalculatorApp("");
                templatePath = "../examples/calculator/templates/calculator.html";
            } else if (appName === "music_player") {
                // Fetch dynamic JSON track list at runtime
                const tracksRes = await fetch("../examples/music_player/resources/music.json");
                const tracksJson = await tracksRes.text();
                app = new MusicPlayerApp("", tracksJson);
                templatePath = "../examples/music_player/templates/music_player.html";
            } else if (appName === "animation") {
                app = new AnimationApp("");
                templatePath = "../examples/animation/templates/animation.html";
            } else if (appName === "animation_css") {
                app = new AnimationCssApp("");
                templatePath = "../examples/animation_css/templates/animation_css.html";
            } else if (appName === "showcase") {
                app = new ShowcaseApp("");
                templatePath = "../examples/showcase/templates/showcase.html";
            } else if (appName === "breakout") {
                app = new BreakoutApp("");
                templatePath = "../examples/breakout/templates/breakout.html";
            }

            // 4. Fetch the template HTML text
            const response = await fetch(templatePath);
            const templateText = await response.text();

            // 5. Initialize Xerune app inside browser DOM
            currentAppCleanup = initXeruneApp({
                app: app,
                containerId: "app",
                templateText: templateText,
                templateBaseDir: templatePath.substring(0, templatePath.lastIndexOf("/")),
                onStateUpdate: (state) => {
                    // Update state view panel
                    document.getElementById("state-json").innerText = JSON.stringify(state, null, 2);
                },
                onMessageSent: (msg) => {
                    // Log message
                    if (logs.firstElementChild && logs.firstElementChild.style.color) {
                        logs.innerHTML = ""; // Clear placeholder
                    }
                    const time = new Date().toLocaleTimeString().split(' ')[0];
                    const item = document.createElement("div");
                    item.className = "log-item";
                    item.innerHTML = `<span class="log-time">[${time}]</span><span class="log-message">${msg}</span>`;
                    logs.appendChild(item);
                    logs.scrollTop = logs.scrollHeight;
                }
            });
        }

        async function start() {
            // Initialize WASM module
            await init();

            // Hook dropdown event
            const selectEl = document.getElementById("example-select");
            selectEl.addEventListener("change", (e) => {
                loadApp(e.target.value).catch(console.error);
            });

            // Initial load
            await loadApp(selectEl.value);
        }

        start().catch(console.error);
    </script>
</body>
</html>
