[package]
name = "xerune_studio"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
xerune = { path = "..", default-features = false, features = ["browser"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
console_log = "1.0"
taffy = { version = "0.9.2", default-features = false, features = ["alloc", "flexbox", "grid", "taffy_tree"] }
console_error_panic_hook = "0.1.7"
tiny-skia = "0.12.0"
anyhow = "1.0"
coarse-prof = "0.2.6"
