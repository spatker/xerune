[package]
name = "xerune_studio"
version = "0.1.0"
edition = "2024"
# The browser build of the inspector, not a library.
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# The examples' Korean translations, which `cfg(feature = "hangul")` gates
# on ARM; the browser draws Hangul with its own fonts, so wasm always has them.
hangul = []

[dependencies]
xerune = { version = "0.1.0", path = "..", default-features = false, features = ["browser"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
console_log = "1.0"
taffy = { version = "0.9.2", default-features = false, features = ["alloc", "flexbox", "grid", "taffy_tree"] }
console_error_panic_hook = "0.1.7"
tiny-skia = "0.12.0"
anyhow = "1.0"
