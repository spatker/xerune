[workspace]
members = ["wpt_runner", "fast_renderer", "xerune_derive", "studio"]


[package]
name = "xerune"
version = "0.1.0"
edition = "2024"
description = "A lightweight, CPU-only native HTML renderer designed for embedded Linux environments"
license = "MIT"
repository = "https://github.com/spatker/xerune"
readme = "README.md"
keywords = ["html", "renderer", "embedded", "mvu", "gui"]
categories = ["embedded", "gui", "rendering"]

[lib]
name = "xerune"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]


[features]
default = ["std", "winit"]
std = [
    "taffy/std",
    "dep:csscolorparser",
    "dep:regex",
    "dep:simplecss",
    "dep:env_logger",
]
profile = ["dep:coarse-prof"]
dynamic-parser = ["dep:html5ever", "dep:markup5ever", "dep:markup5ever_rcdom", "std"]

drm = ["dep:drm", "dep:drm-fourcc", "dep:libc", "std"]
linuxfb = ["dep:linuxfb", "dep:libc", "std"]
evdev = ["dep:evdev", "dep:libc", "std"]
winit = ["dep:winit", "dep:softbuffer", "std"]
browser = ["dep:wasm-bindgen", "dep:serde", "dep:serde_json", "std"]

[dependencies]
xerune_derive = { version = "0.1.0", path = "xerune_derive" }
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
coarse-prof = { version = "0.2.6", optional = true }
html5ever = { version = "0.36.1", optional = true }
markup5ever = { version = "0.36.1", optional = true }
markup5ever_rcdom = { version = "0.36.0", optional = true }
taffy = { version = "0.9.2", default-features = false, features = ["alloc", "flexbox", "grid", "taffy_tree"] }
csscolorparser = { version = "0.6.2", optional = true }
regex = { version = "1.10", optional = true }
log = "0.4"
env_logger = { version = "0.11", optional = true }
hashbrown = { version = "0.14", default-features = false, features = ["ahash", "inline-more"] }
winit = { version = "0.29.15", optional = true }
softbuffer = { version = "0.4.1", optional = true }

# Embedded Linux dependencies
linuxfb = { version = "0.2", optional = true }
drm = { version = "0.12", optional = true }
drm-fourcc = { version = "2.2", optional = true }
evdev = { version = "0.12", optional = true }
libc = { version = "0.2", optional = true }
simplecss = { version = "0.2.2", optional = true }
bytemuck = { version = "1.14", default-features = false }

[dev-dependencies]
coarse-prof = "0.2.6"
winit = "0.29.15"
softbuffer = "0.4.1"
tiny-skia = "0.12.0"
fontdue = "0.9.3"
fast_renderer = { path = "fast_renderer", features = ["profile"] }


serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# For the embedded backend in examples
linuxfb = "0.2"
drm = "0.12"
drm-fourcc = "2.2"
evdev = "0.12"
# anyhow for easier error handling in examples
anyhow = "1.0" 
rand = "0.8"
mimalloc = "0.1.43"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
