name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The toolchain shipped by Yocto Wrynose; xerune must keep building on it.
  RUST_TOOLCHAIN: 1.85.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude xerune_studio
      # The embedded event loop's tests only build with these backends.
      - run: cargo test --lib --features drm,linuxfb,evdev
      - run: cargo build --examples

  arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      # The user's ARM build: zig cross-compiles the C code (ring) and links
      # against glibc 2.39, the version on the target boards.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - run: cargo zigbuild --target armv7-unknown-linux-gnueabihf.2.39 --features drm,linuxfb,evdev --examples
        env:
          # As on the boards (build_arm.sh); without +neon the NEON blend paths are not compiled.
          RUSTFLAGS: -C target-feature=+neon,+vfp4,+d32

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p xerune_studio --target wasm32-unknown-unknown

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Bare-metal Cortex-M4F/M7: the core and the renderer must build
      # without std (microcontrollers).
      - run: cargo check -p xerune -p xerune_render --no-default-features --target thumbv7em-none-eabihf
