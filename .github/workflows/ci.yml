name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The toolchain shipped by Yocto Wrynose; xerune must keep building on it.
  RUST_TOOLCHAIN: 1.85.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude xerune_studio
      # The embedded event loop's tests only build with these backends.
      - run: cargo test --lib --features drm,linuxfb,evdev
      # The studio's template interpreter against the compiled templates.
      - run: cargo test --features interpret --test interpret_tests
      # The studio's model tests, natively (the wasm job only checks it builds).
      - run: cargo test -p xerune_studio --lib
      - run: cargo build --examples
      # Broken doc links, as docs.rs would render them.
      - run: cargo doc --no-deps -p xerune -p xerune_render -p xerune_css -p xerune_template -p xerune_derive
        env:
          RUSTDOCFLAGS: -D warnings

  arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      # The user's ARM build: zig cross-compiles the C code (ring) and links
      # against glibc 2.39, the version on the target boards.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - run: cargo zigbuild --target armv7-unknown-linux-gnueabihf.2.39 --features drm,linuxfb,evdev --examples
        env:
          # As on the boards (build_arm.sh); without +neon the NEON blend paths are not compiled.
          RUSTFLAGS: -C target-feature=+neon,+vfp4,+d32

  # The C and Zig samples of the C API. The library's own tests (and the
  # header check) run with the workspace in `test`.
  capi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - run: cargo build --release -p xerune_capi
      - run: make run
        working-directory: xerune_capi/examples/c
      # The app sample shows itself; headless here: one frame after the
      # message, which must reach the program.
      - run: make run-app
        working-directory: xerune_capi/examples/c
        env:
          XERUNE_SNAPSHOT: app.png
          XERUNE_SNAPSHOT_MESSAGES: buy:2
      - run: cargo build --release -p shop_ui
      - run: make run-app-compiled
        working-directory: xerune_capi/examples/c
        env:
          XERUNE_SNAPSHOT: app.png
          XERUNE_SNAPSHOT_MESSAGES: buy:2
      - run: zig build run
        working-directory: xerune_capi/examples/zig
      # Windows: cross-built here, run on a Windows runner below.
      - run: cargo zigbuild --release -p xerune_capi --target x86_64-pc-windows-gnu
      - run: make shop.exe
        working-directory: xerune_capi/examples/c
      - uses: actions/upload-artifact@v4
        with:
          name: shop-windows
          path: |
            xerune_capi/examples/c/shop.exe
            xerune_capi/examples/ui/

  capi-windows:
    needs: capi
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shop-windows
      # From its directory: the template is ../ui/shop.html.
      - run: ./shop.exe
        working-directory: c

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p xerune_studio --target wasm32-unknown-unknown

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # The CSS parser is the one crate without std: the derive and the
      # runtime share it, and it needs nothing more.
      - run: cargo check -p xerune_css --target thumbv7em-none-eabihf
