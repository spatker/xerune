name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The toolchain shipped by Yocto Wrynose; xerune must keep building on it.
  RUST_TOOLCHAIN: 1.85.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude xerune_studio
      - run: cargo build --examples

  arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      # ring (via the http feature) compiles C code.
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - run: cargo check --target armv7-unknown-linux-gnueabihf --features drm,linuxfb,evdev --examples
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p xerune_studio --target wasm32-unknown-unknown
