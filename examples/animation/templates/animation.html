<style>
    body { margin: 0; }
    /* Stress test: every item moves every frame, so the whole screen is
       redrawn. Keep the per-item work comparable when restyling. */
    .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(180deg, #3b1d6e 0%, #1c2763 50%, #080b1a 100%);
    }
    .item {
        display: flex;
        position: absolute;
        border-radius: 6px;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-size: 12px;
        font-weight: bold;
    }
    .hud {
        display: flex;
        flex-direction: row;
        position: absolute;
        left: 12px;
        top: 12px;
        gap: 6px;
        padding: 6px;
        border-radius: 14px;
        background-color: rgba(8, 10, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .stat { display: flex; flex-direction: column; padding: 4px 10px; border-radius: 9px; background-color: rgba(255, 255, 255, 0.05); }
    .stat-value { font-size: 18px; font-weight: bold; color: #ffffff; }
    .stat-name { font-size: 10px; font-weight: bold; color: #7d86a8; }
    .stat-value.fps { color: #4ade80; }
</style>

<div class="stage">
    {% for item in items %}
    <div class="item"
        style="left: {{ item.x }}px; top: {{ item.y }}px; width: {{ item.size }}px; height: {{ item.size }}px; background-color: {{ item.color }};">
        {{ item.text }}
    </div>
    {% endfor %}
    <div class="hud">
        <div class="stat"><span class="stat-value fps">{{ fps }}</span><span class="stat-name">FPS</span></div>
        <div class="stat"><span class="stat-value">{{ item_count }}</span><span class="stat-name">ITEMS</span></div>
        <div class="stat"><span class="stat-value">{{ frame_ms }}</span><span class="stat-name">FRAME MS</span></div>
        <div class="stat"><span class="stat-value">{{ render_ms }}</span><span class="stat-name">RENDER MS</span></div>
    </div>
</div>
