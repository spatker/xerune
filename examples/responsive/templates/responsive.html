<style>
    html {
        width: 100%;
        height: 100%;
        background-color: #10151c;
        font-family: 'Roboto';
    }
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background-color: #10151c;
    }

    /* Header uses viewport-relative height and shifts color at the tablet breakpoint. */
    .header {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        height: 8vh;
        min-height: 48px;
        padding: 0 3vw;
        background-color: #1b2431;
        border-bottom-width: 2px;
        border-color: #2f6df6;
    }
    .header h1 {
        color: #ffffff;
        font-size: 22px;
        font-weight: bold;
        margin: 0;
    }
    .badge {
        display: flex;
        align-items: center;
        height: 26px;
        padding: 0 12px;
        border-radius: 13px;
        background-color: #2f6df6;
        color: #ffffff;
        font-size: 13px;
    }

    .content {
        display: flex;
        flex-direction: row;
        flex-grow: 1;
        padding: 3vw;
    }

    /* Sidebar is hidden entirely below the 600px mobile breakpoint. */
    .sidebar {
        display: flex;
        flex-direction: column;
        width: 180px;
        margin-right: 24px;
        background-color: #1b2431;
        border-radius: 10px;
        padding: 16px;
    }
    .sidebar-item {
        color: #cfd8e3;
        font-size: 15px;
        margin-bottom: 12px;
    }

    .grid {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        flex-grow: 1;
        align-content: flex-start;
    }
    .card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 200px;
        height: 120px;
        margin: 12px;
        background-color: #26313f;
        border-radius: 12px;
        color: #ffffff;
        font-size: 18px;
        font-weight: bold;
    }
    .card span {
        color: #8fb2e6;
        font-size: 13px;
        font-weight: normal;
        margin-top: 6px;
    }

    /* One card per row on phones, two on tablets, three on wide desktops. */
    @media (max-width: 600px) {
        .card { width: 100%; height: 90px; }
        .header h1 { font-size: 16px; }
    }
    @media (min-width: 600px) and (max-width: 1024px) {
        .card { width: 44%; }
        .header { background-color: #17324d; }
    }
    @media (min-width: 1024px) {
        .card { width: 29%; }
        .header { background-color: #123f2a; }
    }
</style>
<div class="header">
    <h1>Responsive Dashboard</h1>
    <div class="badge">{{ breakpoint }} · {{ width }}x{{ height }}</div>
</div>
<div class="content">
    <div class="sidebar">
        <div class="sidebar-item">Overview</div>
        <div class="sidebar-item">Sensors</div>
        <div class="sidebar-item">Logs</div>
        <div class="sidebar-item">Settings</div>
    </div>
    <div class="grid">
        {% for item in cards %}
        <div class="card">
            {{ item }}
            <span>viewport-scaled</span>
        </div>
        {% endfor %}
    </div>
</div>
