<style>
    * { box-sizing: border-box; }
    body { margin: 0; }

    .app {
        display: flex;
        flex-direction: row;
        width: 100vw;
        height: 100vh;
        padding: 16px;
        gap: 16px;
        background: radial-gradient(circle at 20% 0%, #2a1f12 0%, #14110d 45%, #0c0b0a 100%);
        color: #f5efe6;
    }

    /* ---------- display + tape ---------- */
    /* Right-aligned numbers: proportional digits keep the narrow "1" from
       leaving a gap at the edge as the last digit changes. */
    .screen { display: flex; flex-direction: column; flex-grow: 1; flex-basis: 0px; font-variant-numeric: proportional-nums; }
    .display {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: flex-end;
        height: 168px;
        padding: 18px 22px;
        border-radius: 22px;
        background: linear-gradient(160deg, #221c15 0%, #17130f 100%);
        border: 1px solid rgba(251,191,36,0.12);
        box-shadow: 0px 10px 30px rgba(0,0,0,0.45);
    }
    .expr { font-size: 18px; color: #a39582; min-height: 22px; }
    .value { font-size: 64px; font-weight: bold; color: #ffffff; margin-top: 4px; }

    .tape { display: flex; flex-direction: column; flex-grow: 1; margin-top: 14px; padding: 6px 8px; }
    .tape-title { display: flex; flex-direction: row; justify-content: space-between; font-size: 11px; font-weight: bold;
                  color: #6f6455; margin-bottom: 8px; }
    .tape-row { display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 7px 4px;
                border-bottom: 1px solid rgba(255,255,255,0.05); }
    .tape-expr { font-size: 14px; color: #a39582; }
    .tape-result { font-size: 16px; font-weight: bold; color: #fbbf24; }
    .tape-empty { font-size: 13px; color: #4d453b; margin-top: 6px; }

    /* ---------- keypad ---------- */
    .keypad { display: flex; flex-direction: column; gap: 10px; width: 380px; }
    .row { display: flex; flex-direction: row; gap: 10px; flex-grow: 1; }
    .key {
        display: flex;
        flex-grow: 1;
        flex-basis: 0px;
        justify-content: center;
        align-items: center;
        border-radius: 18px;
        font-size: 26px;
        color: #f5efe6;
        background: linear-gradient(180deg, #2c261f 0%, #221d18 100%);
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0px 3px 8px rgba(0,0,0,0.4);
    }
    .key.wide { flex-grow: 2.1; }
    .key.fn { color: #fbbf24; background: linear-gradient(180deg, #3a3024 0%, #2d251c 100%); font-size: 22px; }
    .key.op { font-weight: bold; color: #1a1205; background: linear-gradient(180deg, #fcd34d 0%, #f59e0b 100%);
              border: 1px solid rgba(253,230,138,0.6); box-shadow: 0px 4px 14px rgba(245,158,11,0.30); }
    .key.op.pending { color: #fbbf24; background: linear-gradient(180deg, #2c261f 0%, #221d18 100%);
                      border: 2px solid #fbbf24; box-shadow: 0px 0px 16px rgba(251,191,36,0.45); }
    .key.eq { font-weight: bold; color: #ffffff; background: linear-gradient(135deg, #fb923c 0%, #e11d48 100%);
              border: 1px solid rgba(254,205,211,0.5); box-shadow: 0px 6px 18px rgba(225,29,72,0.35); }

    /* ---------- portrait (480x800) ---------- */
    @media (orientation: portrait) {
        .app { flex-direction: column; }
        .screen { flex-grow: 0; flex-basis: auto; }
        .display { height: 150px; }
        .tape { height: 150px; flex-grow: 0; }
        .keypad { width: 100%; flex-grow: 1; }
    }
</style>

<div class="app">
    <div class="screen">
        <div class="display">
            <span class="expr">{{ self.expression() }}</span>
            <span class="value" style="font-size: {{ self.value_size() }}px;">{{ display }}</span>
        </div>
        <div class="tape">
            <div class="tape-title"><span>HISTORY</span><span>{{ history.len() }} / 4</span></div>
            {% for entry in history %}
            <div class="tape-row">
                <span class="tape-expr">{{ entry.expr }}</span>
                <span class="tape-result">{{ entry.result }}</span>
            </div>
            {% endfor %}
            {% if history.is_empty() %}
            <span class="tape-empty">Results show up here.</span>
            {% endif %}
        </div>
    </div>

    <div class="keypad">
        <div class="row">
            <div class="key fn" data-on-click="clear">{% if self.is_fresh() %}AC{% else %}C{% endif %}</div>
            <div class="key fn" data-on-click="negate">±</div>
            <div class="key fn" data-on-click="percent">%</div>
            <div class="key op {% if self.pending("/") %}pending{% endif %}" data-on-click="op:/">÷</div>
        </div>
        <div class="row">
            <div class="key" data-on-click="digit:7">7</div>
            <div class="key" data-on-click="digit:8">8</div>
            <div class="key" data-on-click="digit:9">9</div>
            <div class="key op {% if self.pending("*") %}pending{% endif %}" data-on-click="op:*">×</div>
        </div>
        <div class="row">
            <div class="key" data-on-click="digit:4">4</div>
            <div class="key" data-on-click="digit:5">5</div>
            <div class="key" data-on-click="digit:6">6</div>
            <div class="key op {% if self.pending("-") %}pending{% endif %}" data-on-click="op:-">−</div>
        </div>
        <div class="row">
            <div class="key" data-on-click="digit:1">1</div>
            <div class="key" data-on-click="digit:2">2</div>
            <div class="key" data-on-click="digit:3">3</div>
            <div class="key op {% if self.pending("+") %}pending{% endif %}" data-on-click="op:+">+</div>
        </div>
        <div class="row">
            <div class="key wide" data-on-click="digit:0">0</div>
            <div class="key" data-on-click="digit:.">.</div>
            <div class="key eq" data-on-click="equals">=</div>
        </div>
    </div>
</div>
