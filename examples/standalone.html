<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xerune App</title>
</head>
<body>
    <!-- The app's view becomes this page's body: `?app=todo`, `calculator`,
         `music_player`, `animation`, `animation_css`, `showcase` or `breakout`.
         Serve the workspace root (see docs/guide.md, section 10). -->
    <script type="module">
        import init, {
            TodoApp,
            CalculatorApp,
            MusicPlayerApp,
            AnimationApp,
            AnimationCssApp,
            ShowcaseApp,
            BreakoutApp
        } from "../studio/pkg/xerune_studio.js?v=11";
        import { initXeruneApp } from "../xerune.js?v=10";

        const apps = {
            todo: [() => new TodoApp(""), "./todo/templates/todo_list.html"],
            calculator: [() => new CalculatorApp(""), "./calculator/templates/calculator.html"],
            music_player: [async () => {
                const tracks = await (await fetch("./music_player/resources/music.json")).text();
                return new MusicPlayerApp("", tracks);
            }, "./music_player/templates/music_player.html"],
            animation: [() => new AnimationApp(""), "./animation/templates/animation.html"],
            animation_css: [() => new AnimationCssApp(""), "./animation_css/templates/animation_css.html"],
            showcase: [() => new ShowcaseApp(""), "./showcase/templates/showcase.html"],
            breakout: [() => new BreakoutApp(""), "./breakout/templates/breakout.html"],
        };

        async function start() {
            await init();
            const name = new URLSearchParams(window.location.search).get("app") || "music_player";
            const [create, templatePath] = apps[name] ?? apps.music_player;
            initXeruneApp({ app: await create(), templatePath });
        }

        start().catch(console.error);
    </script>
</body>
</html>
