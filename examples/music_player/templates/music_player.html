<style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .app {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        color: #f4f1fa;
    }
    .view {
        display: flex;
        position: absolute;
        top: 0px;
        width: 100vw;
        height: 100vh;
        /* Nothing of the view off screen (the art's glow) shows on the other. */
        overflow: hidden;
        left: 0%;
        transition: left 0.33s ease-in-out;
    }
    /* The list slides out to the left as the player slides in, and back.
       A view enters from its side while the other is still there (not when
       the app starts), and leaves the view once it has slid out. */
    .app.open .list-view { left: -100%; }
    .app:not(.open) .player-view { left: 100%; }
    @starting-style {
        .app.has-player .list-view { left: -100%; }
        .app.has-list .player-view { left: 100%; }
    }

    .cover { border-radius: 10px; flex-shrink: 0; }

    /* Media icons drawn with CSS: conic wedges make the triangles. */
    .ico-play { width: 22px; height: 26px; margin-left: 5px;
                background: conic-gradient(from 240deg at 100% 50%, #0b0a10 0deg 60deg, transparent 60deg); }
    .ico-pause { display: flex; flex-direction: row; gap: 6px; }
    .ico-pause-bar { width: 7px; height: 24px; border-radius: 2px; background-color: #0b0a10; }
    .ico-stop { width: 16px; height: 16px; border-radius: 3px; background-color: #f4f1fa; }
    .ico-skip { display: flex; flex-direction: row; align-items: center; }
    .ico-bar { width: 3px; height: 16px; border-radius: 1px; background-color: #f4f1fa; }
    .ico-tri-left { width: 14px; height: 16px;
                    background: conic-gradient(from 60deg at 0% 50%, #f4f1fa 0deg 60deg, transparent 60deg); }
    .ico-tri-right { width: 14px; height: 16px;
                     background: conic-gradient(from 240deg at 100% 50%, #f4f1fa 0deg 60deg, transparent 60deg); }
</style>
<div class="app {% if let Some(_) = current_track_index %}open{% endif %} {% if list_shown %}has-list{% endif %} {% if player_shown %}has-player{% endif %}" style="background: radial-gradient(circle at 15% 0%, {{ current_track.glow() }} 0%, #110e1a 55%, #0a0810 100%);">
    {% if list_shown %}{% include "music_list.html" %}{% endif %}
    {% if player_shown %}{% include "music_player_view.html" %}{% endif %}
</div>
