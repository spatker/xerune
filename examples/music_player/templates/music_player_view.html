<style>
    .player-view { flex-direction: row; align-items: center; padding: 20px 28px; gap: 34px; }

    .art-col { display: flex; flex-direction: column; align-items: flex-start; }
    .back { display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 14px;
            background-color: rgba(255,255,255,0.06); font-size: 13px; font-weight: bold; color: #d9d4e8; margin-bottom: 16px; }
    .back .ico-tri-left { width: 9px; height: 11px; }
    .art-glow { display: flex; border-radius: 22px; }
    .art { width: 300px; height: 300px; border-radius: 22px; }

    .info-col { display: flex; flex-direction: column; flex-grow: 1; flex-basis: 0px; justify-content: center; padding-top: 30px; }
    .album { font-size: 12px; font-weight: bold; color: #8a83a3; }
    .title { font-size: 32px; font-weight: bold; color: #ffffff; margin-top: 6px; }
    .artist { font-size: 17px; color: #b8b1cf; margin-top: 4px; }

    .viz { display: flex; flex-direction: row; align-items: flex-end; gap: 4px; height: 64px; margin: 22px 0 18px 0; }
    .viz-bar { flex-grow: 1; border-radius: 3px; }

    .progress-row { display: flex; flex-direction: row; align-items: center; gap: 12px; }
    .time { font-size: 12px; color: #9a93b3; width: 34px; }
    .time.right { text-align: right; }
    .track-bar { position: relative; flex-grow: 1; height: 6px; border-radius: 3px; background-color: rgba(255,255,255,0.10); }
    .track-fill { height: 6px; border-radius: 3px; }
    .knob { position: absolute; top: -4px; width: 14px; height: 14px; border-radius: 7px; background-color: #ffffff;
            margin-left: -7px; box-shadow: 0px 2px 6px rgba(0,0,0,0.5); }

    .controls { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 18px; margin-top: 22px; }
    .ctl { display: flex; width: 48px; height: 48px; border-radius: 24px; justify-content: center; align-items: center;
           background-color: rgba(255,255,255,0.06); }
    .play { display: flex; width: 72px; height: 72px; border-radius: 36px; justify-content: center; align-items: center; }

    @media (orientation: portrait) {
        .player-view { flex-direction: column; align-items: stretch; padding: 18px 22px; gap: 0px; }
        .art-col { align-items: center; }
        .back { align-self: flex-start; }
        .art { width: 320px; height: 320px; }
        .info-col { flex-grow: 0; padding-top: 22px; }
    }
</style>

<div class="view player-view" style="left: {{ player_x }}px;{% if transition_progress == 0.0 %} display: none;{% endif %}">
    <div class="art-col">
        <div data-on-click="back" class="back"><div class="ico-tri-left"></div><span>Library</span></div>
        <div class="art-glow" style="box-shadow: 0px 18px 50px {{ current_track.accent }}55;">
            <img src="{{ current_track.cover_url }}" class="cover art" />
        </div>
    </div>

    <div class="info-col">
        <span class="album">{{ current_track.album }}</span>
        <span class="title">{{ current_track.title }}</span>
        <span class="artist">{{ current_track.artist }}</span>

        <div class="viz">
            {% for v in visualizer_data %}
            <div class="viz-bar" style="height: {{ "{:.0}"|format(v) }}px; background: linear-gradient(180deg, {{ current_track.accent }} 0%, {{ current_track.accent }}30 100%);"></div>
            {% endfor %}
        </div>

        <div class="progress-row">
            <span class="time">{{ elapsed_time }}</span>
            <div class="track-bar">
                <div class="track-fill" style="width: {{ self.progress_pct() }}%; background-color: {{ current_track.accent }};"></div>
                <div class="knob" style="left: {{ self.progress_pct() }}%;"></div>
            </div>
            <span class="time right">{{ total_time }}</span>
        </div>

        <div class="controls">
            <div data-on-click="stop" class="ctl"><div class="ico-stop"></div></div>
            <div data-on-click="prev" class="ctl"><div class="ico-skip"><div class="ico-bar"></div><div class="ico-tri-left"></div></div></div>
            <div data-on-click="play_pause" class="play" style="background: linear-gradient(135deg, #ffffff 0%, {{ current_track.accent }} 140%); box-shadow: 0px 8px 24px {{ current_track.accent }}66;">
                {% if is_playing %}
                <div class="ico-pause"><div class="ico-pause-bar"></div><div class="ico-pause-bar"></div></div>
                {% else %}
                <div class="ico-play"></div>
                {% endif %}
            </div>
            <div data-on-click="next" class="ctl"><div class="ico-skip"><div class="ico-tri-right"></div><div class="ico-bar"></div></div></div>
            <div class="ctl" style="background-color: transparent;"></div>
        </div>
    </div>
</div>
