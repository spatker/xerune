[package]
name = "xerune_capi"
version = "0.1.0"
edition = "2024"
description = "C API of xerune: render HTML/CSS templates with a JSON model from C, C++ or Zig"
license = "MIT"
repository = "https://github.com/spatker/xerune"
rust-version = "1.85"
publish = false

[lib]
# staticlib/cdylib for C; rlib for the tests and for crates of compiled
# templates that export the same API.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
xerune = { path = "..", default-features = false, features = ["std", "dynamic-parser", "interpret"] }
xerune_render = { path = "../xerune_render" }
xerune_template = { path = "../xerune_template", features = ["interpret"] }
html5ever = "0.36.1"
markup5ever_rcdom = "0.36.0"
serde_json = "1.0"
taffy = { version = "0.9.2", default-features = false }

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }
