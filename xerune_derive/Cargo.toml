[package]
name = "xerune_derive"
version = "0.1.0"
edition = "2024"
description = "Derive macro for Xerune HTML templates"
license = "MIT"
repository = "https://github.com/spatker/xerune"
readme = "../README.md"
keywords = ["html", "renderer", "embedded", "mvu", "gui"]
categories = ["embedded", "gui", "rendering"]
rust-version = "1.85"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
xerune_css = { version = "=0.1.0", path = "../xerune_css" }
xerune_template = { version = "=0.1.0", path = "../xerune_template" }
